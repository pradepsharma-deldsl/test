name: secure_doc_mobile
publish_to: 'none'
description: Fully offline secure document manager with encrypted SQLite BLOB storage.
version: 2.7.0+7

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite_sqlcipher: ^3.1.0
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  uuid: ^4.5.1
  cryptography: ^2.7.0
  file_picker: ^8.1.7
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
